name: Site

# The site describes the packages on npm, so it goes out with a release:
# the release workflow calls this once the packages are published. Going
# out with every push to main, it described fixes nobody could install
# yet, for as long as their release took.
#
# A change to the site alone can go out by hand, with "Run workflow" on
# the branch or tag to deploy. From main, that also publishes whatever
# main says about changes not released yet; wait for the release then.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-latest

    # The Cloudflare token lives in the `site` environment, which only
    # `main` and the release tags may use. Deploys run one after another;
    # one in progress is never cut short.
    environment:
      name: site
      url: https://tetsujs.com
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Astro runs on Node, and the site's config loads a TypeScript file
      # without a bundler, which needs Node's own type stripping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # The examples on the site compile against the packages of the same
      # commit, so the workspace is installed along with the site.
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd site

      - name: Build
        run: bun run --cwd site build

      - name: Deploy
        run: bun run --cwd site deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
