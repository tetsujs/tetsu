name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code: the token gets nothing more, whatever the
# repository's default is. Actions are pinned to commits, as in the
# release workflow, and Dependabot keeps them current.
permissions:
  contents: read

jobs:
  check:
    name: check (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest

    # The pinned version is the gate. `latest` runs alongside it and is
    # allowed to fail: this framework is built on Bun's own router, cookies
    # and server, and several of its guarantees rest on measured Bun
    # behaviour — a regression there is worth seeing early, and worth not
    # turning the branch red for.
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Quoted on purpose: a bare 1.5 would be read as a number and
          # reach setup-bun as "1.5".
          - bun: "1.4.2"
          - bun: "latest"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install --frozen-lockfile

      # Types are a feature here, not a build step: `.test-d.ts` files hold
      # the contract tests for inference and for the compile errors the
      # framework promises, and `tsc` is the only thing that runs them.
      - name: Types
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # The packages as the tarballs a user installs: `prepack` builds each
      # one, `publint` reads the manifest and `attw` resolves the types; then
      # all of them go into a fresh project outside the repository, which
      # imports every entry point, serves a request and runs `tsc` on them.
      - name: Packages
        run: bun run verify:packages

  sql:
    name: sql (bun ${{ matrix.bun }}, postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    # @tetsujs/sql is tested against a real server: the oldest Postgres the
    # package supports and the newest. The job above leaves these tests
    # out and needs no database. The package needs Bun 1.4.3, not the
    # framework's 1.4.2: before it, Bun.SQL could hand a query the rows of
    # another after a failure in the pipeline. Its guarantees rest on
    # measured Bun.SQL behaviour, so `latest` runs alongside the pinned Bun
    # and is allowed to fail, as above.
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - bun: "1.4.3"
            postgres: "14"
          - bun: "1.4.3"
            postgres: "18"
          - bun: "latest"
            postgres: "18"
            experimental: true

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:sql

  typescript:
    name: types (typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest

    # The main job gates on the compiler the repository pins. These are the
    # other ones a user may bring: the oldest promised, the newest of the
    # line most users are on, and 6, which SvelteKit 3 requires of a
    # frontend using @tetsujs/client. 5.7 is the floor because Bun 1.4's
    # own types need it.
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.7", "5", "6"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bunx -p typescript@${{ matrix.typescript }} tsc --noEmit

      # The repository compiles with skipLibCheck; a user's project may not.
      # The published declarations, checked in a fresh consumer by this
      # compiler with skipLibCheck off — built, as published, by the pinned one.
      - name: Packages
        run: bun run verify:packages --typescript ${{ matrix.typescript }}

  frontends:
    name: frontends (typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest

    # The contract @tetsujs/client generates, where it is used: in a Next and
    # a SvelteKit app without Bun's types, which install the client the way
    # a monorepo links it and prefetch its TanStack Query options on the
    # server, in a server component and in a load. Their contracts are
    # committed, and checked against what the built command writes today;
    # then the apps are type-checked, not built, and the contract on its own
    # with library checks on, which the apps leave off; SvelteKit's pages
    # are also rendered on the server, against the application. Next on each
    # compiler a user may bring; SvelteKit on 6 alone, which it requires, and
    # svelte-check reads types through the compiler's API, which 7 does not
    # have.
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.7", "5", "6", "7"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Contracts
        run: |
          check() {
            bun packages/client/dist/src/cli.js contract \
              packages/client/test-utils/contract-app.ts \
              --tsconfig tsconfig.strictest.json --out "$1" --check
          }
          check fixtures/next/src/api.contract.d.ts
          check fixtures/sveltekit/src/lib/api.contract.d.ts

      - name: Next
        working-directory: fixtures/next
        run: |
          npm ci --no-audit --no-fund
          npx next typegen
          npx -p typescript@${{ matrix.typescript }} tsc --noEmit
          npx -p typescript@${{ matrix.typescript }} tsc -p tsconfig.contract.json

      - name: SvelteKit
        if: matrix.typescript == '6'
        working-directory: fixtures/sveltekit
        run: |
          npm ci --no-audit --no-fund
          npm run check

      # Rendered on the server against the application, which type-checking
      # cannot see: SvelteKit refuses a response header its hook does not
      # allow, and the client reads content-type.
      - name: SvelteKit on the server
        if: matrix.typescript == '6'
        working-directory: fixtures/sveltekit
        run: bun ssr.ts

  strictest:
    name: types (@tsconfig/strictest)
    runs-on: ubuntu-latest

    # A user's flags reach their own code, not the published `.d.ts`: this
    # is where `exactOptionalPropertyTypes` breaks a hook the user mounted.
    # The sources and the type tests are checked; the runtime tests read
    # JSON bodies with dots, which says nothing about the API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run check:strictest

  type-cost:
    name: type cost
    runs-on: ubuntu-latest

    # The compiler's work for a generated 200-route application, alone and
    # read by @tetsujs/client and its TanStack Query options, and for a
    # project of @tetsujs/sql of 200 tables and 200 statements, each held to
    # a budget of instantiations.
    # It is deterministic for a given compiler, so a change that doubles
    # what the types cost fails here instead of in a user's editor.
    # bench/README.md has the numbers.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type cost
        run: bun run --cwd bench types --check

      - name: Type cost of @tetsujs/sql
        run: bun run --cwd bench sql-types --check

  site:
    name: site
    runs-on: ubuntu-latest

    # Every TypeScript example on the site is compiled while it is built,
    # against the packages of the same commit: a change that breaks an
    # example fails here, in the pull request that made it. The site is a
    # project of its own, with its own lockfile, so the framework's jobs do
    # not install it. It goes out with a release, from site.yml, so that it
    # describes what is on npm.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Astro runs on Node, and the site's config loads a TypeScript file
      # without a bundler, which needs Node's own type stripping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd site

      - name: Build
        run: bun run --cwd site build
